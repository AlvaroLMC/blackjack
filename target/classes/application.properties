# Puerto dinámico que Render proporciona
server.port=${PORT:8080}

# MongoDB (Render o Atlas)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# MySQL con R2DBC (Render MySQL o tu propio servicio cloud)
spring.r2dbc.url=${SPRING_R2DBC_URL}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD}

# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:docker}
